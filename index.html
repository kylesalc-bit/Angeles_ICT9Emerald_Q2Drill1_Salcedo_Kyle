<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Drill 1</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.demo{
			padding: 15px;
			margin-bottom: 15px;
			border: 2px solid;
		}
		.container-demo{
			background: lightblue;
			border-color: blue;
		}
		.fluid-demo{
			background: lightgreen;
			border-color: green;
		}
		.sm-demo{
			background: lightyellow;
			border-color: yellow;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="demo container-demo">
			<h3>Beginner's guide to Basketball</h3>
		</div>
	</div>

	<div class="container-fluid">
		<div class="demo fluid-demo">
			<h3>.container fluid</h3>
			<p>This container always occupies 100% of the available width space.</p>
		</div>
	</div>

	<div class="container-sm">
		<div class="demo sm-demo">
			<h3>.container-sm</h3>
			<p>This container takes maximum width starting at 576px</p>
		</div>
	</div>

	<div class="container-md">
		<div class="demo md-demo">
			<h3>.container-md</h3>
			<p>This container takes maximum width starting at 768px</p>
		</div>
	</div>

</body>
</html>
